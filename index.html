<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- ★旧URL。中身は配らず、新URL（05.pineapp.jp）へ送るだけ★
       2026-10-22 に本番を https://pineapp05.web.app/ へ移し、
       2026-11-25 に https://05.pineapp.jp/ （Cloudflare Pages）へ移した。
       ここ（matsupine07.github.io/binary-battle/）を消さないのは、
       note記事 No.59・60・61・73 が本文にこのURLを書いているため。
       ⛔GitHub Pages はサーバー側の転送ができないので meta refresh で送っている。
       canonical を新URLにしてあるので、検索結果は 05.pineapp.jp 側にまとまる。
       （Cloudflare Pages は /screen.html を /screen へ転送するので、canonical は /screen） -->
  <meta http-equiv="refresh" content="0; url=https://05.pineapp.jp/">
  <link rel="canonical" href="https://05.pineapp.jp/screen">
  <title>二進数バトル</title>
</head>
<body>
  <p>二進数バトルは <a href="https://05.pineapp.jp/">https://05.pineapp.jp/</a> に移りました。</p>
  <p>自動で移動しないときは、上のリンクを押してください。</p>
</body>
</html>
